# 테스트 자동 실행: main 푸시와 모든 PR에서 단위 테스트 → 빌드 → 브라우저 E2E
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 단위·화면 테스트 (Jest)
        run: npm test -- --watchAll=false

      # CRA는 CI=true(Actions 기본값)이면 ESLint 경고를 오류로 보고 빌드를 실패시킨다.
      # 경고를 0개로 정리했으므로(docs/IMPROVEMENTS.md 12번) 새 경고가 생기면 여기서 막힌다.
      - name: 프로덕션 빌드
        run: npm run build

      - name: ESLint (src 전체, 테스트 파일 포함, 경고 0개 유지)
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 브라우저 E2E (Playwright)
        run: npx playwright test

      - name: E2E 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
