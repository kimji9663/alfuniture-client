# 테스트 자동 실행: main 푸시와 모든 PR에서 단위 테스트 → 빌드 → 브라우저 E2E
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 단위·화면 테스트 (Jest)
        run: npm test -- --watchAll=false

      - name: 프로덕션 빌드
        run: npm run build
        env:
          # CRA는 CI=true이면 ESLint 경고를 오류로 보고 빌드를 실패시킨다.
          # 기존 경고 정리(docs/IMPROVEMENTS.md 12번) 전까지는 경고를 허용한다.
          CI: false

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 브라우저 E2E (Playwright)
        run: npx playwright test

      - name: E2E 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
